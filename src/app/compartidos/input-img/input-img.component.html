<h3>{{ titulo }}</h3>

<div>
    <button type="button" class="btn-subir-imagen" (click)="cargadorArchivos.click()">

        <i class="bi bi-image"></i>
    </button>


    <button type="button" class="btn-borrar-todo" (click)="eliminarTodasImagenes()">
        <i class="bi bi-trash"></i>
    </button>


    <input type="file" multiple hidden #cargadorArchivos accept="image/*" (change)="cambio($event)">
</div>


<!-- Imagenes Nuevas -->
<div class="imagenes-preview">


      <!-- Recorremos cada imagen -->
    @for (imagen of imagenesBase64; track $index) {

    <div class="preview">

        <!-- Ponemos index + 1 para ahcerlo mas agradable para el UI -->
        <img [src]="imagen" [alt]="'Imagen ' + ($index + 1)">

        <button type="button" class="btn-eliminar" (click)="eliminarImagen($index)">
            ×
        </button>

    </div>

    }

</div>


<!--Si hay Imagenes -->
@if (urlImagenesActuales?.length) {

<div class="imagenes-preview actuales">

    <!-- Recorremos cada imagen -->
    @for (imagen of urlImagenesActuales; track $index) {

    <div class="preview">

        <img [src]="imagen" [alt]="'Imagen actual ' + ($index + 1)">

        <button type="button" class="btn-eliminar" (click)="eliminarImagenActual($index)">
            ×
        </button>

    </div>

    }

</div>

}
