<div class="contacto">

  <div class="contacto-container">

    <div class="contacto-info">
      <span class="contacto-tag">CONTACTO</span>

      <h1>¿Tienes alguna pregunta?</h1>

      <p>
        Estamos aquí para ayudarte. Escríbenos y nos pondremos
        en contacto contigo lo antes posible.
      </p>

      <div class="info-item">
        <i class="bi bi-envelope"></i>
        <div>
          <strong>Correo electrónico</strong>
          <span>contacto tutienda.com</span>
        </div>
      </div>

      <div class="info-item">
        <i class="bi bi-telephone"></i>
        <div>
          <strong>Teléfono</strong>
          <span>+1 809 000 0000</span>
        </div>
      </div>

      <div class="info-item">
        <i class="bi bi-clock"></i>
        <div>
          <strong>Horario</strong>
          <span>Lun - Vie / 8:00 AM - 5:00 PM</span>
        </div>
      </div>

    </div>


    <div class="contacto-card">

      <h2>Envíanos un mensaje</h2>

      <form>

        <div class="form-row">

          <div class="input-group">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              placeholder="Tu nombre">
          </div>

          <div class="input-group">
            <label for="correo">Correo</label>
            <input
              type="email"
              id="correo"
              placeholder="tu@email.com">
          </div>

        </div>

        <div class="input-group">
          <label for="asunto">Asunto</label>
          <input
            type="text"
            id="asunto"
            placeholder="¿En qué podemos ayudarte?">
        </div>

        <div class="input-group">
          <label for="mensaje">Mensaje</label>
          <textarea
            id="mensaje"
            rows="6"
            placeholder="Escribe tu mensaje aquí..." ></textarea>
        </div>

        <button type="submit">
          Enviar mensaje
          <i class="bi bi-arrow-right"></i>
        </button>

      </form>

    </div>

  </div>

</div>
