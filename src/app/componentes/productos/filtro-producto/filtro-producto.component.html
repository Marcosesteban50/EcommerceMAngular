<div class="contenedor-principal">

  <div class="sidebar">

    <form [formGroup]="form" class="price-filter">

      <div class="filter-header">
        <div>
          <span class="filter-label">Filtrar por</span>
          <h3>Precio</h3>
        </div>

        <i class="bi bi-sliders"></i>
      </div>

      <div class="price-values">
        <div class="price-value">
          <span>Mínimo</span>
          <strong>${{ precioMin }}</strong>
        </div>

        <div class="price-value">
          <span>Máximo</span>
          <strong>${{ precioMax }}</strong>
        </div>
      </div>


      <div class="slider-container">

        <label>
          Precio mínimo
        </label>

        <input type="range" min="0" max="5000" step="10" formControlName="precioMin">


        <label>
          Precio máximo
        </label>

        <input type="range" min="0" max="5000" step="10" formControlName="precioMax">

      </div>


      <div class="inputs-precio">

        <div class="input-precio">
          <span>$</span>

          <input type="number" min="0" max="5000" formControlName="precioMin" placeholder="0">
        </div>


        <span class="separador">—</span>


        <div class="input-precio">
          <span>$</span>

          <input type="number" min="0" max="5000" formControlName="precioMax" placeholder="5000">
        </div>

      </div>

    </form>

  </div>

  <div class="contenido-productos">
    <app-lista-productos [productos]="productos" data-aos="zoom-in" data-aos-duration="1200">
    </app-lista-productos>
  </div>

</div>
