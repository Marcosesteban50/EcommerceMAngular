<section class="banner-home">

    <div class="banner-info">

        <h1>
            Descubre las mejores
            <span>ofertas del momento</span>
        </h1>

        <p>
            Miles de productos disponibles con envío rápido,
            precios increíbles y atención personalizada.
        </p>

        <div class="banner-buttons">

            <button class="btn-banner-primary" [disabled]="true">
                <i class="bi bi-lightning-charge-fill"></i>
                Pago seguro
            </button>

            <a routerLink="/productos" class="btn-banner-secondary">
                Explorar Tienda
                <i class="bi bi-arrow-right"></i>
            </a>

        </div>

    </div>

    <div class="banner-image">

        <div class="floating-card envio">
            <i class="bi bi-truck"></i>
            Envíos rápidos
        </div>

        <div class="floating-card seguro">
            <i class="bi bi-shield-lock"></i>
            Pago seguro
        </div>

        <div class="floating-card ofertas">
            <i class="bi bi-percent"></i>
            Grandes descuentos
        </div>

        <div class="circle-glow"></div>

        <i class="bi bi-cart4 cart-icon"></i>

    </div>

</section>
